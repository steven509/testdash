<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: transparent; }
  .window {
    position: absolute; left: 72px; top: 48px;
    border-radius: 22px; overflow: hidden; background: #12121C;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.10) inset, 0 34px 90px rgba(10,8,30,.55), 0 10px 30px rgba(10,8,30,.35);
  }
  .bar {
    height: 64px; position: relative; display: flex; align-items: center; padding-left: 26px; gap: 16px;
    background: linear-gradient(#1F1F31, #1A1A29); border-bottom: 1.5px solid #26263A;
  }
  .dot { width: 24px; height: 24px; border-radius: 50%; }
  .r { background: #FF5F57; } .y { background: #FEBC2E; } .g { background: #28C840; }
  .title {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 500 25px -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: #8E8EAA; letter-spacing: .2px;
  }
  .content { padding: 18px 22px 22px; }
  img { display: block; }
</style></head><body>
<div class="window">
  <div class="bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><div class="title" id="title"></div></div>
  <div class="content"><img id="shot"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').textContent = q.get('title') || 'testdash';
  document.getElementById('shot').src = q.get('img');
</script>
</body></html>
