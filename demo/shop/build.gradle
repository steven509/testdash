plugins { id 'java' }

repositories { mavenCentral() }

dependencies {
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.0.10'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'redis.clients:jedis:5.2.0'
    implementation 'org.apache.kafka:kafka-clients:3.3.2'
    implementation 'org.mongodb:mongodb-driver-sync:4.6.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation platform('io.cucumber:cucumber-bom:7.18.1')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('assembleApp', Sync) {
    from(tasks.named('jar')) { rename { 'shop.jar' } }
    from(configurations.runtimeClasspath) { into 'lib' }
    into layout.buildDirectory.dir('app')
}

tasks.register('composeUp', Exec) {
    dependsOn 'assembleApp'
    commandLine 'docker', 'compose', 'up', '--detach', '--force-recreate', '--renew-anon-volumes', '--wait'
}

test {
    useJUnitPlatform()
    dependsOn 'composeUp'
    // Cucumber's long names repeat the feature in each scenario's, as many builds have them
    systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
}
