name: shop

services:
  shop:
    image: eclipse-temurin:25.0.2_10-jre-alpine-3.23
    command: ["java", "-XX:TieredStopAtLevel=1", "-cp", "/app/shop.jar:/app/lib/*", "com.example.shop.ShopApplication"]
    volumes: ["./build/app:/app:ro"]
    working_dir: /app
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/shop
      DB_USER: shop
      DB_PASSWORD: shop
      BILLING_DB_URL: jdbc:postgresql://postgres:5432/billing
      BILLING_DB_USER: shop
      BILLING_DB_PASSWORD: shop
      KAFKA_BOOTSTRAP: kafka:9092
      MONGO_URI: mongodb://mongodb:27017
      PAYMENTS_URL: http://wiremock:8080
      SHIPPING_URL: http://wiremock:8080
    ports: ["18080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      retries: 60
    depends_on:
      mariadb: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      wiremock: { condition: service_healthy }

  wiremock:
    image: wiremock/wiremock:3.13.1
    command: ["--disable-banner", "--async-response-enabled=true"]
    volumes: ["./wiremock:/home/wiremock:ro"]
    ports: ["18081:8080"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/__admin/health"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      retries: 60

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      retries: 60

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: shop
    volumes: ["./mariadb:/docker-entrypoint-initdb.d:ro"]
    tmpfs: ["/var/lib/mysql"]
    ports: ["13306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      retries: 60

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: billing
    volumes: ["./postgres:/docker-entrypoint-initdb.d:ro"]
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "billing"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      retries: 60

  mongodb:
    image: mongo:7
    ports: ["27018:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      retries: 60
